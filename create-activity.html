<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create activity — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/activity.css">
</head>

<body data-page="create">
    <main class="app">
        <header class="topbar"><a class="brand" href="home.html">uni<span>Mate</span></a><a class="profile-button"
                data-profile-link href="profile.html" aria-label="Profile">◎</a></header>
        <div class="page-actions"><a class="back-link" href="home.html">← Home</a></div>
        <section class="page-card form-card" style="margin-top:16px">
            <h1 class="form-heading">Create an activity</h1>
            <p class="page-copy" style="margin-bottom:23px">Make a plan that other students at your university can join.
            </p>
            <form id="activity-form">
                <div class="field"><label>Category</label>
                    <div class="category-options"><input id="sports" type="radio" name="category" value="sports"
                            checked><label for="sports">Sports</label><input id="study" type="radio" name="category"
                            value="study"><label for="study">Study</label><input id="food" type="radio" name="category"
                            value="food"><label for="food">Food</label><input id="walk" type="radio" name="category"
                            value="walk"><label for="walk">Walk</label><input id="social" type="radio" name="category"
                            value="social"><label for="social">Social</label><input id="other" type="radio"
                            name="category" value="other"><label for="other">Other</label></div>
                </div>
                <div class="field"><label for="title">Title</label><input id="title" name="title" maxlength="80"
                        required placeholder="e.g. Evening badminton"></div>
                <div class="field"><label for="description">Description</label><textarea id="description"
                        name="description" maxlength="500" required
                        placeholder="What should people know before joining?"></textarea></div>
                <div class="form-row">
                    <div class="field"><label for="date">Date</label><input id="date" name="date" type="date" required>
                    </div>
                    <div class="field"><label for="time">Time</label><input id="time" name="time" type="time" required>
                    </div>
                </div>
                <div class="field"><label for="place">Where? <span
                            style="color:var(--subtle);font-weight:400">(optional)</span></label><input id="place"
                        name="place" maxlength="120" placeholder="e.g. Main ground"></div>
                <p class="field-hint">This is a manually entered place, not live location.</p>
                <div class="field"><label for="max-participants">Maximum participants</label><input
                        id="max-participants" name="maxParticipants" type="number" min="2" max="500" required></div>
                <div class="field"><label for="activity-image">Activity image <span
                            style="color:var(--subtle);font-weight:400">(optional)</span></label><input
                        id="activity-image" name="image" type="file" accept="image/*">
                    <p class="field-hint">Images will be stored in Firebase Storage when it is connected.</p>
                </div><button class="primary-button" type="submit">Post activity</button>
                <p class="status-message" id="activity-status"></p>
            </form>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation"><a href="home.html">⌂<span>Home</span></a><a
            href="campus-tea.html">♨<span>Tea</span></a><a class="nav-create active" href="create-activity.html"
            aria-label="Create activity">+</a><a href="chats.html">◌<span>Chats</span></a><a
            href="profile.html">◎<span>Profile</span></a></nav>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/services/users.js"></script>
    <script src="js/services/activities.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/create-activity.js"></script>
</body>

</html>
